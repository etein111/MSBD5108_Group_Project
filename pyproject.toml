[project]
name = "jevbench"
version = "0.1.0"
description = "JevBench: JEV-9B vs Qwen3.5-9B for typed content-safety decisions"
readme = "README.md"
requires-python = ">=3.11"
# Runtime dependencies are pinned in requirements*.txt:
#   requirements.txt          serving (fastapi/uvicorn/httpx/pydantic)
#   requirements-eval.txt     CPU evaluation (numpy/scikit-learn/matplotlib/datasets)
#   requirements-cuda.txt     GPU serving (torch/accelerate/bitsandbytes)

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["pipeline/tests", "deployment/tests"]
